name: DevSecOps CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: task-manager-flask
  REPORT_DIR: security-reports

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          TESTING: '1'
          SECRET_KEY: ${{ secrets.SECRET_KEY_TEST || 'ci-test-secret-key' }}
        run: pytest --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  sast-bandit:
    name: SAST with Bandit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit[toml]

      - name: Run Bandit
        run: |
          mkdir -p "${REPORT_DIR}/bandit"
          bandit -r todo_project/todo_project -x todo_project/tests -ll -ii \
            -f json -o "${REPORT_DIR}/bandit/bandit.json"
          bandit -r todo_project/todo_project -x todo_project/tests -ll -ii \
            -f txt -o "${REPORT_DIR}/bandit/bandit.txt"

      - name: Upload Bandit reports
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: ${{ env.REPORT_DIR }}/bandit

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Dependency-Check in Docker
        run: |
          mkdir -p "${REPORT_DIR}/dependency-check"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/${REPORT_DIR}/dependency-check:/report" \
            owasp/dependency-check:latest \
            --nvdApiKey ${{ secrets.NVD_API_KEY }} \
            --project "Task Manager Flask" \
            --scan /src \
            --out /report \
            --format HTML \
            --format JSON \
            --failOnCVSS 7

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: ${{ env.REPORT_DIR }}/dependency-check

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - sast-bandit
      - dependency-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${{ github.sha }}" .

      - name: Save image artifact
        run: |
          docker save "${IMAGE_NAME}:${{ github.sha }}" | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-image
          path: image.tar.gz

  dast-zap:
    name: DAST with OWASP ZAP
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: task-manager-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Start application container
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY_DAST || 'dast-only-secret-key' }}
          DATABASE_URI: sqlite:////tmp/site.db
        run: |
          docker network create task-manager-sec
          docker run -d --name task-manager-app --network task-manager-sec \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e DATABASE_URI="${DATABASE_URI}" \
            "${IMAGE_NAME}:${{ github.sha }}"
          for i in {1..30}; do
            docker run --rm --network task-manager-sec curlimages/curl:8.11.1 \
              -fsS http://task-manager-app:5000/about && exit 0
            sleep 2
          done
          docker logs task-manager-app
          exit 1

      - name: Run ZAP baseline scan
        run: |
          mkdir -p "${REPORT_DIR}/zap"
          docker run --rm --network task-manager-sec \
            -v "$PWD:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://task-manager-app:5000 \
            -c /zap/wrk/zap-baseline.conf \
            -r "${REPORT_DIR}/zap/zap-baseline.html" \
            -J "${REPORT_DIR}/zap/zap-baseline.json"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: ${{ env.REPORT_DIR }}/zap

      - name: Stop application
        if: always()
        run: |
          docker rm -f task-manager-app || true
          docker network rm task-manager-sec || true

  deploy-dev:
    name: Deploy to development
    runs-on: ubuntu-latest
    needs: dast-zap
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Development deployment gate
        run: echo "Deploy automatizado para desenvolvimento após testes, SAST, SCA, build e DAST."

  deploy-staging:
    name: Deploy to homologation
    runs-on: ubuntu-latest
    needs: dast-zap
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: homologation
    steps:
      - name: Homologation deployment gate
        run: echo "Deploy em homologação para validação funcional, segurança e aceite."

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: dast-zap
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Production deployment gate
        run: echo "Deploy em produção condicionado a aprovação manual no Environment production."
